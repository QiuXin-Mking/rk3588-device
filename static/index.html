<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>数据采集盒</title>
<link rel="stylesheet" href="style.css?v=10">
<style>
/* Touchscreen kiosk: there is no real mouse, so any OS/browser pointer icon
   is just visual noise that flickers between the default arrow and the
   "hand" cursor as elements gain/lose synthetic hover state from touches.
   Hide it everywhere, unconditionally - touch-feedback.js's ripple/dot is
   the only pointer feedback this UI shows. */
*, *::before, *::after { cursor: none !important; }
</style>
</head>
<body>
<!-- Top status bar -->
<header id="topbar">
  <span id="tb-title" data-i18n="home.title">数据采集盒</span>
  <div id="tb-right">
    <span id="tb-bat" class="tb-chip">--</span>
    <span id="tb-time" class="tb-chip">--:--</span>
    <button id="btn-lang" class="tb-chip tb-btn" onclick="App.toggleLang()">EN</button>
  </div>
</header>

<!-- Page container -->
<main id="pages">
  <section id="page-home"   class="page active"></section>
  <section id="page-wifi"   class="page"></section>
  <section id="page-bt"     class="page"></section>
  <section id="page-files"  class="page"></section>
  <section id="page-glove"  class="page"></section>
  <section id="page-record" class="page"></section>
</main>

<!-- Bottom nav -->
<nav id="bottomnav">
  <button class="nav-btn active" data-page="home" onclick="App.nav('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21H3z" stroke="currentColor" fill="none" stroke-width="1.8"/><rect x="9" y="14" width="6" height="7" fill="currentColor" rx="1"/></svg>
    <span data-i18n="nav.home">主页</span>
  </button>
  <button class="nav-btn" data-page="record" onclick="App.nav('record')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" fill="none" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
    <span data-i18n="nav.record">录制</span>
  </button>
  <button class="nav-btn" data-page="files" onclick="App.nav('files')">
    <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h4l2 3h8a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" fill="none" stroke-width="1.8"/></svg>
    <span data-i18n="nav.files">文件</span>
  </button>
  <button class="nav-btn" data-page="bt" onclick="App.nav('bt')">
    <svg viewBox="0 0 24 24"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span data-i18n="nav.bt">蓝牙</span>
  </button>
  <button class="nav-btn" data-page="wifi" onclick="App.nav('wifi')">
    <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="nav.wifi">WiFi</span>
  </button>
  <button class="nav-btn" data-page="glove" onclick="App.nav('glove')">
    <svg viewBox="0 0 24 24"><path d="M18 11V8a2 2 0 00-4 0v3M14 8V5a2 2 0 00-4 0v3M10 8V6a2 2 0 00-4 0v8l-1.5-1.5a1.5 1.5 0 00-2 2.1L6 19a4 4 0 004 3h4a4 4 0 004-4v-7" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="nav.glove">手套</span>
  </button>
</nav>

<!-- Modal overlay -->
<div id="modal-overlay" class="hidden" onclick="App.closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden"></div>

<script src="i18n.js?v=12"></script>
<script src="app.js?v=13"></script>
<script src="touch-feedback.js?v=1"></script>
</body>
</html>
