server {
    listen 8083 ssl;
    server_name collection.vendetech.com;
    client_max_body_size 200m;
    ssl_certificate     /etc/nginx/cert/collection.vendetech.com.pem;
    ssl_certificate_key /etc/nginx/cert/collection.vendetech.com.key;

    # ── SPA: serve static files with HTML5 history fallback ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # ── API: reverse proxy to backend container ──
    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ── MinIO public proxy ──
    # Browser-visible HTTPS entrypoint for presigned uploads/downloads.
    location /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass         http://183.230.200.167:19000;
        proxy_http_version 1.1;
        proxy_set_header   Host              183.230.200.167:19000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ── OpenAPI docs proxy ──
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
